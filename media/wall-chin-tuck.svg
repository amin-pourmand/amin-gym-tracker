<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
  <title id="title">Wall chin tuck animated guide</title><desc id="desc">Side view showing the head gliding straight backward toward the wall while the eyes stay level.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071416"/><stop offset="1" stop-color="#102b2c"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="720" height="405" rx="28" fill="url(#bg)"/>
  <text x="34" y="46" fill="#70f1d8" font-family="Arial,sans-serif" font-size="18" font-weight="700">WALL CHIN TUCK</text><text x="34" y="70" fill="#789493" font-family="Arial,sans-serif" font-size="11">GLIDE STRAIGHT BACK • EYES LEVEL • HOLD 3 SECONDS</text><path d="M250 87v267" stroke="#3f6061" stroke-width="9"/><path d="M263 91v259" stroke="#1d3b3c" stroke-width="2"/>
  <path d="M365 343Q408 266 454 343" fill="#718d8b"/><path d="M409 309L409 233" stroke="#9fb2b0" stroke-width="24" stroke-linecap="round"/><path d="M409 245Q436 253 451 273" fill="none" stroke="#58ecd2" stroke-width="10" opacity=".45"/>
  <g filter="url(#g)"><circle cx="438" cy="181" r="53" fill="#c7d8d6"/><path d="M466 172l25 15-25 9" fill="#c7d8d6"/><circle cx="459" cy="168" r="4" fill="#132326"/><path d="M466 207q-18 9-31 0" fill="none" stroke="#6f8583" stroke-width="4"/><animateTransform attributeName="transform" type="translate" values="0 0;-42 0;-42 0;0 0" keyTimes="0;.35;.72;1" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;0 0 1 1;.4 0 .2 1"/></g>
  <path d="M471 112H347" stroke="#f0ca66" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;32" dur="1.1s" repeatCount="indefinite"/></path><path d="M359 102l-16 10 16 10" fill="none" stroke="#f0ca66" stroke-width="3"/><text x="491" y="117" fill="#d9bc65" font-family="Arial,sans-serif" font-size="12">HEAD BACK</text><path d="M489 169h46" stroke="#526e6e" stroke-width="2"/><text x="541" y="174" fill="#7d9896" font-family="Arial,sans-serif" font-size="11">EYES LEVEL</text><rect x="34" y="371" width="652" height="4" rx="2" fill="#183b3a"/><rect x="34" y="371" width="652" height="4" rx="2" fill="#50dfc7"><animate attributeName="width" values="0;652;652;0" keyTimes="0;.35;.72;1" dur="3.4s" repeatCount="indefinite"/></rect>
</svg>
